<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>BookVault-Pay</title>
</head>
<body>
    <div id="container">
        <div id="logo">
            <img src="image/Logo.png" alt="logo">
        </div>
        <div id="header">
            <h1>BOOKVAULT </h1>
            
            <nav>
                 <ul>
                    <li> <a href="index.html">Home</a> </li>
                   <li> <a href="About.html">About Us</a> </li>
                   <li> <a href="Contact.html">Contact Us</a> </li>
                </ul>
                
            </nav>
            <h3>Payment Option</h3>
        </div>

        <div id ="card-logo">
            <h4>Debit/Credit Card</h4>
            <div class="images">
                <img src="image/master.webp" alt="master-card">
                <img src="image/revolute.png" alt="revolute">
                <img src="image/klarna.png" alt="klarna">
                <img src="image/VISA.png">
            </div>
            
        </div>

        <form id ="payment-form">

            <div class="form-group">
                <label for="card-number">Card Number</label>
            <input type="text" id="card-number">
            </div>
            
            <div class="form-group">
                <p>
                    <label for="expiration-date">Expiration Date</label>
                    <select id="expiration-date">
                        <option value="">Month</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
    
                    <select id="year">
                        <option value="">Year</option>
                        <option value="2026">2026</option>
                        <option value="2026">2027</option>
                        <option value="2026">2028</option>
                        <option value="2026">2029</option>
                        <option value="2026">2030</option>
                        <option value="2026">2031</option>
                        <option value="2026">2032</option>
                        <option value="2026">2033</option>
                        <option value="2026">2034</option>
                        <option value="2026">2035</option>
                
                    </select>
                </p>
    
            </div>
            
            <div class="form-group">
                <label for="security-code">Security Code </label>
            <input type="text" id="security-code">
            <p>(3-4 digit code on the back of your card)</p>
            
            </div>
            
            <button type="submit">Continue</button>
           
        </form>
    </div>
</body>
</html>
